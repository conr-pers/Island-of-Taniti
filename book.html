<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Book your adventure!
        </title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav>
            <ul class="nav">
                <li><a href="index.html" id="title">Island of Taniti</a></li>
                <li><a href="food.html">Food</a></li>
                <li><a href="transportation.html">Plan Your Stay</a></li>
                <li><a href="exploration.html">Exploration</a></li>
                <li><a href="book.html" id="bookBtn">Book Now!</a></li>
            </ul>
        </nav>
        <main>
            <h2>We're excited to see you!</h2>
            <form target="_self">
                <label>From <span>*</span></label>
                <input type="text" required>
                <label>To Taniti Island</label>
                <br>
                <label>Number of Visitors<span>*</span></label>
                <input type="number" required>
                <br>
                <label>First Day<span>*</span></label>
                <input type="date" required id="date">
                <script>
                    document.getElementById("date").min = new Date().toISOString().split("T")[0];
                </script>
                <label>Last Day<span>*</span></label>
                <input type="date" required>
                <br>
                <label>Activities</label>
                <br>
                <label>Zip-lining|</label>
                <input type="checkbox">
                <label>Fishing Tour|</label>
                <input type="checkbox">
                <label>Bus Tour|</label>
                <input type="checkbox">
                <br>
                <button type="submit">Submit</button>
            </form>
        </main>
    </body>
</html>
